short_bio: | 
  <p>Hi! I am Khang, a Ph.D. student at UCLA, advised by <a href="https://scholar.google.com/citations?user=X2Qs7XYAAAAJ&hl=en">Dr. Mani Srivastava</a>. My research interests span Physical AI, robotics, and embodied intelligence.</p>
  <p>I received my B.S. in Computer Science from Michigan State University (MSU) with a 4.0 GPA and the <a href="https://engineering.msu.edu/news/trustees-honor-34-spartan-engineers-40-gpa-excellence">Board of Trustees' Award</a>. At MSU, I was advised by <a href="https://cse.msu.edu/~caozc/">Dr. Zhichao Cao</a> in the Edge Intelligence and Networking (EIN) group and collaborated with <a href="https://mi-zhang.github.io/index.html">Dr. Mi Zhang</a> at OSU AIoT. I also worked with <a href="https://cse.msu.edu/~qyan/">Dr. Qiben Yan</a> in the SEcure and Intelligent Things (SEIT) Lab.</p>
  <p>In Summer 2025, I interned with <a href="https://www.cs.purdue.edu/homes/chunyi/index.html">Dr. Chunyi Peng</a> in the Mobile Systems, Security, and Networking (MSSN) Group at Purdue University.</p>
  <p>I am always open to research collaborations and new ideas, feel free to reach out!</p>
