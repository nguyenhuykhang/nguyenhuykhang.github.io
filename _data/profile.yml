short_bio: | 
  <p>Hi! I am Khang Nguyen, a recent Computer Science graduate from <a href="https://msu.edu/">Michigan State University (MSU)</a> with a perfect 4.0 GPA and the <a href="https://engineering.msu.edu/news/trustees-honor-34-spartan-engineers-40-gpa-excellence">Board of Trustees’ Award</a>. I have had the wonderful opportunity to be advised by <a href="https://cse.msu.edu/~caozc/">Dr. Zhichao Cao</a> in the Edge Intelligence and Networking (EIN) group, and I also collaborate with <a href="https://mi-zhang.github.io/index.html">Dr. Mi Zhang</a> at OSU AIoT.</p>
  <p>I have also worked with <a href="https://cse.msu.edu/~qyan/">Dr. Qiben Yan</a> in the SEcure and Intelligent Things (SEIT) Lab. In Summer 2025, I interned with <a href="https://www.cs.purdue.edu/homes/chunyi/index.html">Dr. Chunyi Peng</a> at the Purdue Mobile System, Security and Networking (MSSN) Group.</p>
  <p>My research interests span Physical AI and Robotics. I am always open to collaboration opportunities, feel free to reach out!</p>
